<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>    
    <title>Drill 2</title>
    <style>
        body {
            font-family: monospace;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .navbar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid rgba(35, 30, 30, 0.358);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin: 0 auto;
            
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input {
            margin-bottom: 10px;
            text-align: center;
        }

        button {
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        #result {
            margin-top: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            word-wrap: break-word;
        }    
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="seatwork.html">Seatwork</a>
        <a href="drill2.html">Drill 2</a>
        <a href="skillstest.html">Skills test</a>
        <a href="project.html">Meet the creator</a>
    </nav>
    
    <h1>Club Members</h1>
    
    <div class="container">
        <label>First name:</label>
        <input type="text" id="First" placeholder="First Name">
        
        <label>Last name:</label>
        <input type="text" id="Last" placeholder="Last Name">
        
        <button py-click="Add">Add</button>
    </div>

    <div id="result"></div>
    
    <script type="py" src="drill2.py"></script>
</body>
</html>

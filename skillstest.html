<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-metal Elements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        body {
            font-family: monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .navbar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: #fff;
        }

        .card {     
            background-color: rgba(253, 249, 249, 0.712); /* This rgba lets me make the box transparent if needed */
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            border: 2px solid rgba(35, 30, 30, 0.358);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: monospace;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        input {
            text-align: center;
        }

        button { /* makes the button aesthetic wow */
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body class="text-center">  
    <nav class="navbar"> 
        <a href="seatwork.html">Seatwork</a> 
        <a href="drill2.html">Drill 2</a>
        <a href="skillstest.html">Skills test</a>
        <a href="project.html">Meet the creator</a>
    </nav>

    <div class="card">
        <div class="container">
            <h1>Non-metal Elements</h1>
            <p>Enter an element symbol</p>
            <input type="text" id="element1" placeholder="Ex. O">
        </div>

        <button py-click="search_element">Search Element</button>
        
        <div class="result"></div>
        <h3 class="mt-4">Search Result</h3>
        <p><b>Element Symbol: <span id="symbol"></span></b></p>
        <p><b>Element Name: <span id="name"></span></b></p>
        <p><b>Atomic Number: <span id="Atomic#"></span></b></p>
        <p><b>Atomic Mass: <span id="AtomicMass"></span></b></p>
    </div>

    <script type="py" src="skillstest.py"></script>
</body>
</html>
